<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1628"/>
      <stop offset="100%" stop-color="#0f2040"/>
    </linearGradient>
    <radialGradient id="glow" cx="65%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#1d72f2" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#0a1628" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- Left accent bar -->
  <rect x="0" y="0" width="6" height="630" fill="#3b82f6"/>

  <!-- Name -->
  <text x="90" y="230" font-family="Inter, Arial, sans-serif" font-size="72" font-weight="800" fill="#ffffff" letter-spacing="-1">Jelmar Degoro</text>

  <!-- Divider line under name -->
  <rect x="90" y="255" width="460" height="3" rx="2" fill="#3b82f6"/>

  <!-- Role -->
  <text x="90" y="310" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="500" fill="#60a5fa">QA Analyst  |  Configuration Analyst</text>

  <!-- Bio blurb -->
  <text x="90" y="365" font-family="Inter, Arial, sans-serif" font-size="20" fill="#94a3b8">5+ years in Software QA &amp; Configuration Analysis</text>
  <text x="90" y="395" font-family="Inter, Arial, sans-serif" font-size="20" fill="#94a3b8">Laravel Backend  |  Vue.js &amp; Tailwind CSS Frontend</text>

  <!-- Location -->
  <text x="90" y="450" font-family="Inter, Arial, sans-serif" font-size="18" fill="#64748b">Davao City, Philippines</text>

  <!-- URL pill -->
  <rect x="90" y="490" width="320" height="44" rx="22" fill="#1d4ed8" opacity="0.85"/>
  <text x="250" y="519" font-family="Inter, Arial, sans-serif" font-size="17" fill="#ffffff" text-anchor="middle">jelmardegoro.vercel.app</text>

  <!-- Right: decorative circle -->
  <circle cx="980" cy="315" r="200" fill="#1d4ed8" opacity="0.08"/>
  <circle cx="980" cy="315" r="140" fill="none" stroke="#3b82f6" stroke-width="2" opacity="0.25"/>
  <circle cx="980" cy="315" r="80" fill="none" stroke="#60a5fa" stroke-width="1.5" opacity="0.3"/>

  <!-- Initials in circle -->
  <text x="980" y="340" font-family="Inter, Arial, sans-serif" font-size="80" font-weight="900" fill="#3b82f6" text-anchor="middle" opacity="0.6">JD</text>
</svg>
